name: Sync Notion PR

on:
  pull_request:
    branches: [dev]

permissions:
  contents: read
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Notion PR Sync
        uses: Slipum/sync-notion-pr@v1.2.0
        with:
          notion_token: ${{ secrets.NOTION_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
