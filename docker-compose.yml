services:
  test_db:
    container_name: postgres
    image: postgres:14.21-alpine
    shm_size: 128mb
    restart: always
    ports:
      - 5432:5432
    environment:
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
      - POSTGRES_DB=${DATABASE_DBNAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DATABASE_USER} -d ${DATABASE_DBNAME}']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  test_backend:
    depends_on:
      test_db:
        condition: service_healthy
    container_name: backend
    build:
      context: .
    ports:
      - 8080:${SERVER_PORT}
    restart: always
    environment:
      - DATABASE_USER=${DATABASE_USER}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - DATABASE_DBNAME=${DATABASE_DBNAME}
      - SERVER_PORT=${SERVER_PORT}
      - DATABASE_HOST=${DATABASE_HOST}
      - DATABASE_PORT=${DATABASE_PORT}
    healthcheck:
      test:
        ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:${SERVER_PORT}']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
